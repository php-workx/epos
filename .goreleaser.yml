version: 2

project_name: epos

before:
  hooks:
    - go mod download

builds:
  - id: epos
    main: ./cmd/epos
    binary: epos
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.gitCommit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

archives:
  - id: epos
    ids:
      - epos
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"

release:
  github:
    owner: php-workx
    name: epos
  prerelease: auto
  replace_existing_artifacts: true
